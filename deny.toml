[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "Unicode-DFS-2016", "0BSD", "CDLA-Permissive-2.0", "Apache-2.0 WITH LLVM-exception"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[advisories]
yanked = "deny"
# RUSTSEC-2024-0370: proc-macro-error is a compile-time macro crate pulled in only by the Linux GTK3
# bindings of Tauri's WebView (gtk3-macros); it is not in the Windows/macOS builds and has no
# runtime code. Remove this entry once Tauri moves off gtk3.
ignore = [{ id = "RUSTSEC-2024-0370", reason = "build-time macro in Tauri's Linux gtk3 stack" }]
