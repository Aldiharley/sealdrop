[workspace]
resolver = "2"
members = [
  "crates/sealdrop-core",
  "crates/sealdrop-release",
  "crates/sealdrop-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Aldiharley/sealdrop"
rust-version = "1.85"

[workspace.dependencies]
age = { version = "0.12.1", features = ["armor", "plugin"] }
age-core = "0.12"
anyhow = "1"
argon2 = "0.6"
base64 = "0.22"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
hex = "0.4"
minisign = "0.10"
rand = "0.9"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zeroize = { version = "1", features = ["derive"] }
assert_cmd = "2"
predicates = "3"
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
