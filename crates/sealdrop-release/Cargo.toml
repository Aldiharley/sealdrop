[package]
name = "sealdrop-release"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Self-hostable key-release service for sealdrop timed release"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sealdrop-release"
path = "src/main.rs"

[dependencies]
sealdrop-core = { path = "../sealdrop-core" }
anyhow.workspace = true
axum = { version = "0.8", features = ["json", "macros"] }
base64.workspace = true
chrono.workspace = true
clap.workspace = true
minisign.workspace = true
rand.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.7", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum-test = "21"
