name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - name: Install reference age for interop tests
        run: go install filippo.io/age/cmd/age@latest
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --exclude sealdrop-desktop -- -D warnings
      - run: cargo test --workspace --exclude sealdrop-desktop
        env: { PATH: "${{ env.PATH }}:${{ env.HOME }}/go/bin" }
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check licenses advisories }
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo build -p sealdrop-desktop --release
