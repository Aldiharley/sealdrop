name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - name: Install reference age for interop tests
        shell: bash
        run: |
          go install filippo.io/age/cmd/age@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --exclude sealdrop-desktop -- -D warnings
      # The vector generator compiles only with test-support; lint it too.
      - run: cargo clippy -p sealdrop-core --all-targets --features test-support -- -D warnings
      - run: cargo test --workspace --exclude sealdrop-desktop
        env:
          SEALDROP_REQUIRE_AGE: "1"
      - name: Format-spec conformance vectors
        run: cargo test -p sealdrop-core --test format_vectors
        env:
          SEALDROP_REQUIRE_AGE: "1"
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check licenses advisories }
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Guard each step on the checked-out tree: a job-level `if` is evaluated before
      # checkout, when hashFiles() cannot see the repo, so it would skip the job forever.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('apps/desktop/package.json') != '' }}
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        if: ${{ hashFiles('apps/desktop/package.json') != '' }}
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('apps/desktop/package.json') != '' }}
        with: { node-version: 22 }
      - run: npm ci
        if: ${{ hashFiles('apps/desktop/package.json') != '' }}
        working-directory: apps/desktop
      - run: npm run build
        if: ${{ hashFiles('apps/desktop/package.json') != '' }}
        working-directory: apps/desktop
      # The rust job excludes the desktop crate (it needs the built frontend), so its
      # clippy and command-layer tests run here, after `npm run build`.
      - run: cargo clippy -p sealdrop-desktop --all-targets -- -D warnings
        if: ${{ hashFiles('apps/desktop/package.json') != '' }}
      - run: cargo test -p sealdrop-desktop
        if: ${{ hashFiles('apps/desktop/package.json') != '' }}
      - run: cargo build -p sealdrop-desktop --release
        if: ${{ hashFiles('apps/desktop/package.json') != '' }}
